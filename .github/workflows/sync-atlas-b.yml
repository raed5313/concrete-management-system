name: Sync ATLAS A updates to branch B

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'B/**'

permissions:
  contents: write

jobs:
  sync-atlas-b:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Copy shared application files into B
        run: |
          rsync -av --delete \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='B/' \
            --exclude='README.md' \
            ./ B/

          python3 - <<'PY'
          from pathlib import Path
          import json

          index = Path("B/index.html")
          html = index.read_text(encoding="utf-8")
          html = html.replace('content="ATLAS">', 'content="ATLAS B">')
          html = html.replace(
              '<title>أطلس للكونكريت | نظام إدارة الخرسانة الجاهزة</title>',
              '<title>أطلس للكونكريت | ATLAS B - الفرع الثاني</title>'
          )
          index.write_text(html, encoding="utf-8")

          manifest = Path("B/manifest.webmanifest")
          data = json.loads(manifest.read_text(encoding="utf-8"))
          data["name"] = "أطلس للكونكريت | ATLAS B - الفرع الثاني"
          data["short_name"] = "ATLAS B"
          manifest.write_text(
              json.dumps(data, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8"
          )
          PY

          sed -i "s/^const CACHE_NAME = .*/const CACHE_NAME = \"atlas-b-shell-${GITHUB_SHA:0:8}\";/" B/service-worker.js
          sed -i 's/key.startsWith("atlas-shell-")/key.startsWith("atlas-b-shell-")/' B/service-worker.js

      - name: Commit synchronized branch B
        run: |
          git add B
          if git diff --cached --quiet; then
            echo "Branch B is already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Sync shared ATLAS application updates to B"
          git push
