name: Sync ATLAS A updates to branch B

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'B/**'

permissions:
  contents: write

# Keep branch synchronization runs serialized to avoid competing pushes.
concurrency:
  group: atlas-branch-sync-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sync-atlas-b:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Copy shared application files into B
        run: |
          rsync -av --delete \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='B/' \
            --exclude='README.md' \
            ./ B/

          python3 - <<'PY'
          from pathlib import Path
          import json

          index = Path("B/index.html")
          html = index.read_text(encoding="utf-8")
          html = html.replace('content="ATLAS">', 'content="ATLAS B">')
          # Keep B connected to its own independent Supabase project.
          html = html.replace(
              "const SUPABASE_URL = 'https://nwhmcbwjjpusvxyyquaz.supabase.co';",
              "const SUPABASE_URL = 'https://lnccpommcksrilekelvk.supabase.co';"
          )
          html = html.replace(
              "const SUPABASE_ANON_KEY = 'sb_publishable_N_nx0pUqoOFCGsrsPjK4Uw_6LgY9ZjL';",
              "const SUPABASE_ANON_KEY = 'sb_publishable_5nooVdw5hjgd97KuGVYEOw_SDcM2pAp';"
          )

          html = html.replace(
              '<title>أطلس للكونكريت | نظام إدارة الخرسانة الجاهزة</title>',
              '<title>أطلس للكونكريت | ATLAS B - الفرع الثاني</title>'
          )
          html = html.replace(
              'aria-label="رمز النظام A">A',
              'aria-label="رمز النظام B">B'
          )
          html = html.replace(
              'ATLAS READY MIX CONCRETE',
              'ATLAS B · BRANCH B'
          )
          html = html.replace(
              'شركة أطلس للكونكريت الجاهز · ATLAS CONCRETE</div>',
              'شركة أطلس للكونكريت الجاهز · ATLAS CONCRETE · BRANCH B</div>'
          )

          marker_css = '#atlasBranchMarker{position:fixed;top:max(8px,env(safe-area-inset-top));right:8px;z-index:10001;background:#3a2c0b;color:#ffe08a;border:1px solid #d5a638;border-radius:999px;padding:6px 12px;font-size:11px;font-weight:900;letter-spacing:.3px;box-shadow:0 3px 12px #0008;pointer-events:none}'
          if 'atlasBranchMarker{' not in html:
              html = html.replace('</style>', marker_css + '\n</style>', 1)

          old_branch = """  if (appTitle) appTitle.content = 'ATLAS B';
          }"""
          new_branch = """  if (appTitle) appTitle.content = 'ATLAS B';
            document.documentElement.dataset.atlasBranch = 'B';
            const branchMarker = document.createElement('div');
            branchMarker.id = 'atlasBranchMarker';
            branchMarker.textContent = 'ATLAS B · الفرع الثاني';
            branchMarker.setAttribute('aria-label', 'أنت داخل نظام الفرع B');
            const addBranchMarker = () => { if (document.body && !document.getElementById('atlasBranchMarker')) document.body.appendChild(branchMarker); };
            addBranchMarker();
            if (!document.body) document.addEventListener('DOMContentLoaded', addBranchMarker, {once:true});
          }"""
          if old_branch not in html:
              raise SystemExit('Expected branch branding block not found; refusing to publish an unbranded B copy.')
          html = html.replace(old_branch, new_branch, 1)
          index.write_text(html, encoding="utf-8")

          config = Path("B/supabase-config.js")
          config.write_text(
              'window.SUPABASE_CONFIG = {\n'
              '  url: "https://lnccpommcksrilekelvk.supabase.co",\n'
              '  publishableKey: "sb_publishable_5nooVdw5hjgd97KuGVYEOw_SDcM2pAp"\n'
              '};\n',
              encoding="utf-8"
          )

          manifest = Path("B/manifest.webmanifest")
          if manifest.exists():
              data = json.loads(manifest.read_text(encoding="utf-8"))
              data["name"] = "أطلس للكونكريت | ATLAS B - الفرع الثاني"
              data["short_name"] = "ATLAS B"
              manifest.write_text(
                  json.dumps(data, ensure_ascii=False, indent=2) + "\n",
                  encoding="utf-8"
              )
          PY

          sed -i "s/^const CACHE_NAME = .*/const CACHE_NAME = \"atlas-b-shell-${GITHUB_SHA:0:8}\";/" B/service-worker.js
          sed -i 's/key.startsWith("atlas-shell-")/key.startsWith("atlas-b-shell-")/' B/service-worker.js

      - name: Commit synchronized branch B
        run: |
          git add B
          if git diff --cached --quiet; then
            echo "Branch B is already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Sync shared ATLAS application updates to B"
          git pull --rebase origin main
          git push
