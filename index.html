<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>شركة صدى الإعمار | نظام إدارة الخرسانة الجاهزة</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
:root {
    --bg-dark: #090d12;
    --panel-bg: #111a22;
    --border-color: #29404d;
    --primary-cyan: #42d8e8;
    --primary-gold: #e4b84f;
    --border-gold: #d4af37;
    --text-white: #f3f7fa;
    --text-muted: #93a7b3;
}
* { box-sizing: border-box; margin: 0; padding: 0; font-family: Tahoma, Arial, sans-serif; }
body { background: var(--bg-dark); color: var(--text-white); min-height: 100vh; }
.login-screen { display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; background: radial-gradient(circle at center, #111a22 0%, #090d12 100%); }
.login-card { background: var(--panel-bg); border: 2px solid var(--border-gold); border-radius: 16px; padding: 30px; width: 100%; max-width: 420px; box-shadow: 0 20px 40px rgba(0,0,0,0.6); text-align: center; }
.login-card h2 { color: var(--primary-gold); margin-bottom: 5px; font-size: 22px; }
.login-card p { color: var(--text-muted); font-size: 13px; margin-bottom: 20px; }
.form-group { text-align: right; margin-bottom: 15px; }
.form-group label { display: block; font-size: 12px; margin-bottom: 6px; color: #b9c8d0; }
.form-group input { width: 100%; padding: 10px; background: #080f15; border: 1px solid var(--border-color); border-radius: 8px; color: #fff; font-size: 13px; }
.btn-login { width: 100%; padding: 12px; background: linear-gradient(135deg, #c69214, #e6b800); border: none; border-radius: 8px; color: #000; font-weight: bold; font-size: 15px; cursor: pointer; margin-top: 10px; }
.app-layout { display: grid; grid-template-columns: 260px 1fr; min-height: 100vh; }
.sidebar { background: #0d151c; padding: 15px; border-left: 1px solid var(--border-color); display: flex; flex-direction: column; overflow-y: auto; max-height: 100vh; }
.brand { text-align: center; padding-bottom: 15px; border-bottom: 1px solid var(--border-color); margin-bottom: 15px; }
.brand h3 { color: var(--primary-gold); font-size: 16px; margin-top: 5px; }
.brand small { color: var(--primary-cyan); font-size: 10px; }
.user-badge { background: var(--panel-bg); border: 1px solid var(--border-color); border-radius: 8px; padding: 10px; margin-bottom: 15px; text-align: right; font-size: 11px; }
.user-badge span { color: var(--primary-gold); font-weight: bold; display: block; font-size: 12px; }
.nav-links { display: flex; flex-direction: column; gap: 4px; flex: 1; }
.nav-btn { background: transparent; border: 1px solid transparent; color: var(--text-muted); padding: 10px 12px; border-radius: 8px; text-align: right; cursor: pointer; font-size: 13px; display: flex; align-items: center; gap: 10px; }
.nav-btn.active, .nav-btn:hover { background: #173b45; color: var(--primary-cyan); border-color: #287d89; }
.btn-logout { background: #351a22; color: #ff8791; border: 1px solid #71313d; padding: 10px; border-radius: 8px; cursor: pointer; margin-top: 15px; font-weight: bold; font-size: 13px; }
.main-content { padding: 20px; overflow-y: auto; max-height: 100vh; }
.header-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 10px; }
.card { background: var(--panel-bg); border: 1px solid var(--border-color); border-radius: 12px; padding: 18px; margin-bottom: 18px; }
.btn-action { background: #147d77; color: #fff; border: none; padding: 9px 16px; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 13px; }
.btn-gold { background: #352c18; color: #f1cc71; border: 1px solid #6f5924; }
.btn-danger { background: #351a22; color: #ff8791; border: 1px solid #71313d; }
table { width: 100%; border-collapse: collapse; margin-top: 10px; }
th, td { padding: 10px; border-bottom: 1px solid var(--border-color); text-align: right; font-size: 12px; }
th { background: #080f15; color: var(--primary-cyan); }
.hidden { display: none !important; }
.modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.8); display: flex; justify-content: center; align-items: center; z-index: 1000; }
.modal-body { background: var(--panel-bg); padding: 20px; border-radius: 12px; width: 90%; max-width: 550px; border: 1px solid var(--border-gold); }
.notification-banner { background: #352c18; border: 1px solid var(--border-gold); padding: 12px; border-radius: 8px; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; animation: pulse 1.5s infinite; }
@keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.6; } 100% { opacity: 1; } }
</style>
</head>
<body>

    <!-- LOGIN SCREEN -->
    <div id="loginScreen" class="login-screen">
        <div class="login-card">
            <i class="fas fa-building-circle-check" style="font-size: 45px; color: var(--primary-gold); margin-bottom: 10px;"></i>
            <h2>شركة صدى الإعمار</h2>
            <p>نظام إدارة الخرسانة الجاهزة والوصولات</p>
            
            <form onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label>اسم المستخدم</label>
                    <input type="text" id="username" placeholder="أدخل اسم المستخدم" required>
                </div>
                <div class="form-group">
                    <label>كلمة المرور</label>
                    <input type="password" id="password" placeholder="أدخل كلمة المرور" required>
                </div>
                <button type="submit" class="btn-login">تسجيل الدخول</button>
            </form>
            <div id="loginError" style="color: #ff8791; font-size: 12px; margin-top: 15px; display: none;">اسم المستخدم أو كلمة المرور غير صحيحة!</div>
            
            <div style="margin-top: 20px; text-align: right; background: #080f15; padding: 10px; border-radius: 8px; font-size: 11px; color: var(--text-muted);">
                <strong style="color: var(--primary-gold); font-size: 12px; display:block; margin-bottom: 4px;">حسابات الدخول المعتمدة:</strong>
                • المدير: <b>raed</b> / <b>2002</b><br>
                • المشغل: <b>raed1</b> / <b>20021</b><br>
                • المحاسب: <b>raed 2</b> / <b>20022</b>
            </div>
        </div>
    </div>

    <!-- MAIN APP INTERFACE -->
    <div id="appLayout" class="app-layout hidden">
        <aside class="sidebar">
            <div class="brand">
                <i class="fas fa-truck-monster" style="font-size: 28px; color: var(--primary-gold);"></i>
                <h3>صدى الإعمار</h3>
                <small>SADA AL-EMAR CONCRETE</small>
            </div>

            <div class="user-badge">
                مرحباً: <span id="displayUser">-</span>
                الصلاحية: <small id="displayRole" style="color: var(--primary-cyan); display:block;">-</small>
            </div>

            <nav class="nav-links" id="sidebarNav"></nav>

            <button class="btn-logout" onclick="handleLogout()"><i class="fas fa-sign-out-alt"></i> تسجيل الخروج</button>
        </aside>

        <main class="main-content">
            <header class="header-bar">
                <h2 id="pageTitle">الرئيسية</h2>
                <div id="actionArea"></div>
            </header>

            <div id="operatorNotifications"></div>
            <div id="mainViewContainer"></div>
        </main>
    </div>

    <!-- MODAL -->
    <div id="modalOverlay" class="modal-overlay hidden">
        <div class="modal-body">
            <h3 id="modalTitle" style="color: var(--primary-gold); margin-bottom: 15px;">إضافة</h3>
            <form id="dynamicForm" onsubmit="handleFormSubmit(event)"></form>
        </div>
    </div>

<script>
const USERS = {
    'raed': { pass: '2002', role: 'admin', name: 'المدير العام' },
    'raed1': { pass: '20021', role: 'operator', name: 'مشغّل المعمل' },
    'raed 2': { pass: '20022', role: 'accountant', name: 'المحاسب' }
};

const NAV_ITEMS = [
    { id: 'dashboard', label: 'الرئيسية', icon: 'fa-home', roles: ['admin', 'operator', 'accountant'] },
    { id: 'orders', label: 'أوامر التجهيز', icon: 'fa-file-invoice', roles: ['admin', 'operator', 'accountant'] },
    { id: 'customers', label: 'العملاء', icon: 'fa-users', roles: ['admin', 'accountant'] },
    { id: 'plants', label: 'المعامل', icon: 'fa-industry', roles: ['admin'] },
    { id: 'drivers', label: 'السائقون', icon: 'fa-user-tie', roles: ['admin', 'operator'] },
    { id: 'vehicles', label: 'الآليات / الخلاطات', icon: 'fa-truck-moving', roles: ['admin', 'operator'] },
    { id: 'inventory', label: 'المخزون', icon: 'fa-boxes', roles: ['admin', 'operator'] },
    { id: 'accounts', label: 'الحسابات', icon: 'fa-calculator', roles: ['admin', 'accountant'] },
    { id: 'invoices', label: 'الفواتير', icon: 'fa-receipt', roles: ['admin', 'accountant'] },
    { id: 'receipts', label: 'القبض', icon: 'fa-hand-holding-usd', roles: ['admin', 'accountant'] },
    { id: 'expenses', label: 'المصروفات', icon: 'fa-wallet', roles: ['admin', 'accountant'] },
    { id: 'employees', label: 'الموظفون', icon: 'fa-id-card', roles: ['admin'] },
    { id: 'archive', label: 'المتابعة والأرشفة', icon: 'fa-archive', roles: ['admin', 'accountant'] },
    { id: 'reports', label: 'التقارير', icon: 'fa-chart-line', roles: ['admin', 'operator', 'accountant'] },
    { id: 'permissions', label: 'المستخدمون والصلاحيات', icon: 'fa-user-shield', roles: ['admin'] },
    { id: 'settings', label: 'الإعدادات', icon: 'fa-cog', roles: ['admin'] }
];

let currentUser = null;
let activeTab = 'dashboard';

let store = JSON.parse(localStorage.getItem('sada_app_data')) || {
    orders: [],
    loads: [],
    nextOrderNo: 1,
    nextReceiptNo: 1
};

function saveStore() {
    localStorage.setItem('sada_app_data', JSON.stringify(store));
    render();
}

function playBeep() {
    try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(880, ctx.currentTime);
        gain.gain.setValueAtTime(0.1, ctx.currentTime);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.5);
    } catch(e) {}
}

function handleLogin(e) {
    e.preventDefault();
    const u = document.getElementById('username').value.trim();
    const p = document.getElementById('password').value.trim();
    const err = document.getElementById('loginError');

    if (USERS[u] && USERS[u].pass === p) {
        currentUser = USERS[u];
        err.style.display = 'none';
        document.getElementById('loginScreen').classList.add('hidden');
        document.getElementById('appLayout').classList.remove('hidden');
        
        document.getElementById('displayUser').innerText = currentUser.name;
        document.getElementById('displayRole').innerText = getRoleLabel(currentUser.role);
        
        buildSidebarNav();
        switchTab('dashboard');
    } else {
        err.style.display = 'block';
    }
}

function handleLogout() {
    currentUser = null;
    document.getElementById('appLayout').classList.add('hidden');
    document.getElementById('loginScreen').classList.remove('hidden');
}

function getRoleLabel(role) {
    if (role === 'admin') return 'مدير النظام (جميع الصلاحيات)';
    if (role === 'operator') return 'مشغّل معمل (أوامر وحمولات وتقارير)';
    if (role === 'accountant') return 'محاسب (قراءة، طباعة وأرشفة)';
}

function buildSidebarNav() {
    const nav = document.getElementById('sidebarNav');
    nav.innerHTML = '';
    
    let allowedItems = NAV_ITEMS;
    if (currentUser.role === 'operator') {
        // للمشغل 3 عناصر فقط حسب الطلب
        allowedItems = NAV_ITEMS.filter(i => ['dashboard', 'orders', 'reports'].includes(i.id));
    }

    allowedItems.forEach(item => {
        if (item.roles.includes(currentUser.role)) {
            nav.innerHTML += `
                <button class="nav-btn ${item.id === activeTab ? 'active' : ''}" id="nav-${item.id}" onclick="switchTab('${item.id}')">
                    <i class="fas ${item.icon}"></i> ${item.label}
                </button>
            `;
        }
    });
}

function switchTab(tabId) {
    activeTab = tabId;
    document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
    const activeBtn = document.getElementById(`nav-${tabId}`);
    if (activeBtn) activeBtn.classList.add('active');

    const item = NAV_ITEMS.find(i => i.id === tabId);
    document.getElementById('pageTitle').innerText = item ? item.label : '';
    
    render();
}

function render() {
    const container = document.getElementById('mainViewContainer');
    const actionArea = document.getElementById('actionArea');
    const notifArea = document.getElementById('operatorNotifications');
    actionArea.innerHTML = '';
    notifArea.innerHTML = '';

    // إشعارات مشغل المعمل للأوامر المرسلة
    if (currentUser.role === 'operator') {
        const pendingOrders = store.orders.filter(o => o.status === 'مرسل للمعمل' || o.status === 'قيد الانتظار');
        if (pendingOrders.length > 0) {
            notifArea.innerHTML = pendingOrders.map(o => `
                <div class="notification-banner">
                    <div>
                        <strong style="color:var(--primary-gold)"><i class="fas fa-bell"></i> أمر تجهيز جديد مطلوب!</strong>
                        <div style="font-size:12px; margin-top:4px;">رقم الأمر: <b>${o.no}</b> | العميل: ${o.customer} | الكمية: ${o.qty} م³ | نوع الصب: ${o.pour} | الموقع: ${o.site}</div>
                    </div>
                    <div>
                        ${o.status === 'قيد الانتظار' ? `<button class="btn-action" style="padding:5px 10px; font-size:11px;" onclick="updateOrderStatus('${o.no}', 'مرسل للمعمل')">استلام الأمر</button>` : ''}
                        ${o.status === 'مرسل للمعمل' ? `<button class="btn-action btn-gold" style="padding:5px 10px; font-size:11px;" onclick="updateOrderStatus('${o.no}', 'بدء التجهيز')">بدء التجهيز</button>` : ''}
                    </div>
                </div>
            `).join('');
        }
    }

    if (activeTab === 'dashboard') {
        let totalQty = 0;
        store.loads.forEach(l => totalQty += Number(l.qty || 0));
        container.innerHTML = `
            <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-bottom: 20px;">
                <div class="card">أوامر التجهيز<strong style="display:block; font-size:24px; color:var(--primary-cyan); margin-top:8px;">${store.orders.length}</strong></div>
                <div class="card">إجمالي الحمولات<strong style="display:block; font-size:24px; color:var(--primary-cyan); margin-top:8px;">${store.loads.length}</strong></div>
                <div class="card">المجهز (م³)<strong style="display:block; font-size:24px; color:var(--primary-gold); margin-top:8px;">${totalQty} م³</strong></div>
            </div>
            <div class="card">
                <h3>أحدث أوامر التجهيز</h3>
                <table>
                    <thead><tr><th>رقم الأمر</th><th>التاريخ</th><th>الزبون</th><th>الحالة</th><th>الكمية</th></tr></thead>
                    <tbody>
                        ${store.orders.slice(-5).reverse().map(o => `<tr><td>${o.no}</td><td>${o.date}</td><td>${o.customer}</td><td><span style="color:var(--primary-cyan)">${o.status || 'جديد'}</span></td><td>${o.qty} م³</td></tr>`).join('') || '<tr><td colspan="5" style="text-align:center;">لا توجد بيانات</td></tr>'}
                    </tbody>
                </table>
            </div>
        `;
    } else if (activeTab === 'orders') {
        if (currentUser.role === 'admin') {
            actionArea.innerHTML = `<button class="btn-action" onclick="openNewOrderModal()">＋ إضافة أمر تجهيز جديد</button>`;
        }
        
        let ordersRows = '';
        if (store.orders.length === 0) {
            ordersRows = '<tr><td colspan="8" style="text-align:center; padding:15px;">لا توجد أوامر تجهيز مسجلة.</td></tr>';
        } else {
            store.orders.forEach(o => {
                const orderLoads = store.loads.filter(l => l.orderNo === o.no);
                let actionsHTML = '';
                
                // المدير: إرسال للمعمل، تعديل، حذف
                if (currentUser.role === 'admin') {
                    if (!o.status || o.status === 'جديد') {
                        actionsHTML += `<button class="btn-action btn-gold" style="padding: 4px 10px; font-size:11px; margin-left: 4px;" onclick="sendToPlant('${o.no}')">📤 إرسال للمعمل</button>`;
                    }
                    actionsHTML += `<button class="btn-action btn-danger" style="padding: 4px 10px; font-size:11px;" onclick="deleteOrder('${o.no}')">حذف</button>`;
                }

                // المشغل: إضافة حمولة وإكمال الأمر
                if (currentUser.role === 'operator') {
                    actionsHTML += `<button class="btn-action" style="padding: 4px 10px; font-size:11px; margin-left: 4px;" onclick="openAddLoadModal('${o.no}')">＋ حمولة (${orderLoads.length})</button>`;
                    if (o.status !== 'مكتمل') {
                        actionsHTML += `<button class="btn-action btn-gold" style="padding: 4px 10px; font-size:11px;" onclick="updateOrderStatus('${o.no}', 'مكتمل')">إكمال الأمر</button>`;
                    }
                }

                // المحاسب: عرض وطباعة فقط
                if (currentUser.role === 'accountant') {
                    actionsHTML += `<span style="font-size:11px; color:var(--text-muted);">👁️ مشاهدة فقط</span>`;
                }

                let loadsHTML = '';
                orderLoads.forEach(l => {
                    loadsHTML += `
                        <tr style="background: #080f15;">
                            <td>حمولة رقم: <b style="color:var(--primary-gold)">${l.loadIndex}</b></td>
                            <td>وصل رقم: ${l.receiptNo}</td>
                            <td>الآلية: ${l.vehicle}</td>
                            <td>المضخة: ${l.pump}</td>
                            <td>الكمية: ${l.qty} م³</td>
                            <td colspan="3">
                                <button class="btn-action btn-gold" style="padding:3px 8px; font-size:11px;" onclick="printReceipt('${l.id}')"><i class="fas fa-print"></i> طباعة الوصل</button>
                            </td>
                        </tr>
                    `;
                });

                ordersRows += `
                    <tr>
                        <td><b>${o.no}</b></td>
                        <td>${o.date}</td>
                        <td>${o.customer}</td>
                        <td>${o.site}</td>
                        <td>${o.pour}</td>
                        <td><span style="color:var(--primary-gold)">${o.status || 'جديد'}</span></td>
                        <td>${o.qty} م³</td>
                        <td>${actionsHTML}</td>
                    </tr>
                    ${loadsHTML}
                `;
            });
        }

        container.innerHTML = `
            <div class="card">
                <h3>جدول أوامر التجهيز والحمولات</h3>
                <div style="overflow-x:auto;">
                    <table>
                        <thead>
                            <tr>
                                <th>رقم الأمر</th>
                                <th>التاريخ</th>
                                <th>اسم الزبون</th>
                                <th>موقع الصب</th>
                                <th>نوع الصب</th>
                                <th>الحالة</th>
                                <th>الكمية (م³)</th>
                                <th>الإجراءات</th>
                            </tr>
                        </thead>
                        <tbody>${ordersRows}</tbody>
                    </table>
                </div>
            </div>
        `;
    } else {
        container.innerHTML = `
            <div class="card">
                <h3>قسم ${NAV_ITEMS.find(i=>i.id===activeTab).label}</h3>
                <p style="color:var(--text-muted); font-size:13px; margin-top:10px;">القسم يعمل بنجاح ضمن الصلاحيات المخصصة لحسابك.</p>
            </div>
        `;
    }
}

function openNewOrderModal() {
    document.getElementById('modalTitle').innerText = 'أمر تجهيز جديد (صلاحية المدير)';
    const form = document.getElementById('dynamicForm');
    form.innerHTML = `
        <input type="hidden" name="formType" value="newOrder">
        <div class="form-group"><label>اسم الزبون</label><input type="text" name="customer" value="شركة النور للمقاولات" required></div>
        <div class="form-group"><label>موقع الصب</label><input type="text" name="site" value="كربلاء - حي الحسين" required></div>
        <div class="form-group"><label>نوع الصب</label><input type="text" name="pour" value="سقوف" required></div>
        <div class="form-group"><label>المواصفة (رتبة الخرسانة)</label><input type="text" name="grade" value="C25" required></div>
        <div class="form-group"><label>الكمية التقديرية (م³)</label><input type="number" name="qty" value="50" required></div>
        <div style="display:flex; gap:10px; margin-top:20px;">
            <button type="submit" class="btn-action" style="flex:1;">حفظ الأمر</button>
            <button type="button" class="btn-action btn-danger" style="flex:1;" onclick="closeModal()">إلغاء</button>
        </div>
    `;
    document.getElementById('modalOverlay').classList.remove('hidden');
}

function openAddLoadModal(orderNo) {
    const existingLoads = store.loads.filter(l => l.orderNo === orderNo);
    const nextIndex = existingLoads.length + 1;

    document.getElementById('modalTitle').innerText = 'إضافة حمولة للأمر ' + orderNo;
    const form = document.getElementById('dynamicForm');
    form.innerHTML = `
        <input type="hidden" name="formType" value="newLoad">
        <input type="hidden" name="orderNo" value="${orderNo}">
        <div class="form-group"><label>رقم الحمولة الإجباري (تلقائي 1.2.3...)</label><input type="number" name="loadIndex" value="${nextIndex}" readonly style="background:#080f15;"></div>
        <div class="form-group"><label>رقم الآلية (الخلاطة)</label><input type="text" name="vehicle" value="KRB-101" required></div>
        <div class="form-group"><label>رقم المضخة</label><input type="text" name="pump" value="P-01" required></div>
        <div class="form-group"><label>الكمية المجهزة (م³)</label><input type="number" name="qty" value="10" required></div>
        <div style="display:flex; gap:10px; margin-top:20px;">
            <button type="submit" class="btn-action" style="flex:1;">تسجيل وطباعة الوصل</button>
            <button type="button" class="btn-action btn-danger" style="flex:1;" onclick="closeModal()">إلغاء</button>
        </div>
    `;
    document.getElementById('modalOverlay').classList.remove('hidden');
}

function closeModal() {
    document.getElementById('modalOverlay').classList.add('hidden');
}

function handleFormSubmit(e) {
    e.preventDefault();
    const formData = new FormData(e.target);
    const type = formData.get('formType');

    if (type === 'newOrder') {
        const newOrder = {
            no: 'ORD-2026-' + String(store.nextOrderNo++).padStart(3, '0'),
            customer: formData.get('customer'),
            site: formData.get('site'),
            pour: formData.get('pour'),
            grade: formData.get('grade'),
            qty: formData.get('qty'),
            status: 'جديد',
            date: new Date().toISOString().slice(0,10)
        };
        store.orders.push(newOrder);
    } else if (type === 'newLoad') {
        const newLoad = {
            id: Date.now().toString(),
            orderNo: formData.get('orderNo'),
            loadIndex: formData.get('loadIndex'),
            receiptNo: String(store.nextReceiptNo++).padStart(4, '0'),
            vehicle: formData.get('vehicle'),
            pump: formData.get('pump'),
            qty: formData.get('qty'),
            date: new Date().toISOString().slice(0,10)
        };
        store.loads.push(newLoad);
    }

    saveStore();
    closeModal();
}

function sendToPlant(no) {
    const order = store.orders.find(o => o.no === no);
    if (order) {
        order.status = 'مرسل للمعمل';
        playBeep();
        saveStore();
        alert('تم إرسال الأمر إلى المعمل بنجاح وتنبيه المشغل!');
    }
}

function updateOrderStatus(no, newStatus) {
    const order = store.orders.find(o => o.no === no);
    if (order) {
        order.status = newStatus;
        saveStore();
    }
}

function deleteOrder(no) {
    if (confirm('هل أنت تأكد من حذف هذا الأمر ومناقلاته؟')) {
        store.orders = store.orders.filter(o => o.no !== no);
        store.loads = store.loads.filter(l => l.orderNo !== no);
        saveStore();
    }
}
